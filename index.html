<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>후쿠오카 3박 4일</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #5f6675;
      --line: #dfe3ec;
      --accent: #2b3a67;
      --day1: #d9482b;
      --day2: #0f8f84;
      --day3: #7a4fb5;
      --day4: #1f6fd1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141720;
        --card: #1e2230;
        --text: #eef0f6;
        --muted: #a5adbf;
        --line: #333a4d;
        --accent: #9fb2ff;
        --day1: #ff7d62;
        --day2: #3ccfc1;
        --day3: #b997f0;
        --day4: #6fb0ff;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      font-size: 17px;
      line-height: 1.6;
    }

    #trip-info {
      padding: 32px 16px 24px;
      text-align: center;
      background: var(--accent);
      color: #fff;
    }
    #trip-info h1 { margin: 0 0 4px; font-size: 26px; }
    #trip-info p { margin: 0; opacity: .9; }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 8px 16px 48px;
    }

    section { margin-top: 32px; }
    h2 { font-size: 21px; margin: 0 0 16px; }

    /* ---------- 세로 타임라인 ---------- */
    .day { --c: var(--accent); margin-bottom: 28px; }
    .day1 { --c: var(--day1); }
    .day2 { --c: var(--day2); }
    .day3 { --c: var(--day3); }
    .day4 { --c: var(--day4); }

    .day h3 {
      display: inline-block;
      margin: 0 0 12px;
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--c);
      color: #fff;
      font-size: 16px;
    }
    @media (prefers-color-scheme: dark) {
      .day h3 { color: #101319; }
    }

    .day ol {
      list-style: none;
      margin: 0;
      padding: 0 0 0 22px;
      border-left: 3px solid var(--c);
      margin-left: 8px;
    }
    .day li {
      position: relative;
      margin-bottom: 10px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--c);
      border-radius: 10px;
    }
    .day li:last-child { margin-bottom: 0; }
    .day li::before {
      content: "";
      position: absolute;
      left: -34px;
      top: 50%;
      width: 15px;
      height: 15px;
      margin-top: -7.5px;
      border-radius: 50%;
      background: var(--card);
      border: 4px solid var(--c);
    }

    /* ---------- 예산표 ---------- */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td { padding: 12px 14px; text-align: left; }
    td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    thead th { background: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) {
      thead th { color: #101319; }
    }
    tbody tr + tr td { border-top: 1px solid var(--line); }
    tfoot th {
      border-top: 2px solid var(--accent);
      font-size: 19px;
    }

    /* ---------- 준비물 ---------- */
    #checklist-items {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #checklist-items li {
      margin-bottom: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    #checklist-items label {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 10px 14px;
      cursor: pointer;
    }
    #checklist-items input {
      width: 24px;
      height: 24px;
      accent-color: var(--accent);
      flex: none;
    }
    #checklist-items input:checked + span,
    #checklist-items label:has(input:checked) {
      color: var(--muted);
      text-decoration: line-through;
    }
  </style>
</head>
<body>

  <header id="trip-info">
    <h1>후쿠오카 3박 4일 여행</h1>
    <p>성인 4명 · 10월 출발</p>
  </header>

  <main>

    <section id="schedule">
      <h2>날짜별 일정</h2>

      <article id="day1" class="day day1">
        <h3>Day 1</h3>
        <ol>
          <li>오후 도착</li>
          <li>캐널시티</li>
          <li>나카스 포장마차 (저녁)</li>
        </ol>
      </article>

      <article id="day2" class="day day2">
        <h3>Day 2</h3>
        <ol>
          <li>다자이후 텐만구</li>
          <li>스타벅스 다자이후점</li>
          <li>저녁 모츠나베</li>
        </ol>
      </article>

      <article id="day3" class="day day3">
        <h3>Day 3</h3>
        <ol>
          <li>유후인 당일치기 (버스 왕복)</li>
          <li>긴린코 호수</li>
        </ol>
      </article>

      <article id="day4" class="day day4">
        <h3>Day 4</h3>
        <ol>
          <li>하카타역 쇼핑</li>
          <li>오후 출국</li>
        </ol>
      </article>
    </section>

    <section id="budget">
      <h2>1인 예산</h2>
      <table>
        <thead>
          <tr><th>항목</th><th>금액</th></tr>
        </thead>
        <tbody>
          <tr><td>항공</td><td data-amount="250000">250,000원</td></tr>
          <tr><td>숙소 (3박)</td><td data-amount="180000">180,000원</td></tr>
          <tr><td>식비</td><td data-amount="150000">150,000원</td></tr>
          <tr><td>교통</td><td data-amount="80000">80,000원</td></tr>
        </tbody>
        <tfoot>
          <tr><th>합계</th><th id="budget-total">660,000원</th></tr>
        </tfoot>
      </table>
    </section>

    <section id="checklist">
      <h2>준비물</h2>
      <ul id="checklist-items">
        <li><label><input type="checkbox" data-key="passport"> 여권</label></li>
        <li><label><input type="checkbox" data-key="sim"> 유심</label></li>
        <li><label><input type="checkbox" data-key="yen"> 1인 엔화 3만 엔</label></li>
        <li><label><input type="checkbox" data-key="umbrella"> 우산</label></li>
      </ul>
    </section>

  </main>

  <script>
    // 예산 합계: 항목 금액(data-amount)을 더해 표시
    (function () {
      var total = 0;
      document.querySelectorAll('#budget [data-amount]').forEach(function (cell) {
        total += Number(cell.dataset.amount);
      });
      document.getElementById('budget-total').textContent = total.toLocaleString('ko-KR') + '원';
    })();

    // 준비물 체크리스트: 체크 상태를 localStorage에 저장·복원
    (function () {
      var STORAGE_KEY = 'fukuoka-trip-checklist';
      var boxes = document.querySelectorAll('#checklist-items input[type="checkbox"]');

      function load() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch (e) {
          return {};
        }
      }

      function save() {
        var state = {};
        boxes.forEach(function (box) { state[box.dataset.key] = box.checked; });
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) { /* 저장이 막혀 있어도 체크는 동작 */ }
      }

      var saved = load();
      boxes.forEach(function (box) {
        box.checked = !!saved[box.dataset.key];
        box.addEventListener('change', save);
      });
    })();
  </script>

</body>
</html>
